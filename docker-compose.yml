version: '3.9'

services:
  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - ./.env

  api:
    build: .
    container_name: api
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - .:/app
  
  test_db:
    image: postgres:15
    container_name: test_db
    environment:
      POSTGRES_DB: ${TEST_DB_NAME}
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASS}
    ports:
      - "5433:5432"
    env_file:
      - ./.env
  
  tests:
    build: .
    container_name: tests
    depends_on:
      - test_db
    env_file:
      - ./.env
    environment:
      - DB_HOST=test_db
      - DB_NAME=${TEST_DB_NAME}
      - DB_USER=${TEST_DB_USER}
      - DB_PASS=${TEST_DB_PASS}
    command: ["pytest", "-v", "--cov=app"]

volumes:
  postgres_data:
